  <text x="120" y="475" text-anchor="end" class="time">+4148.3 ms</text>
  <line x1="140" y1="470" x2="1320" y2="470" stroke="#e6e9ec" stroke-width="1"/>
  <circle cx="970" cy="470" r="7" fill="#18734b"/>
  <rect x="984" y="454" width="250" height="32" rx="6" fill="#ffffff" stroke="#18734b"/>
  <text x="995" y="475" class="event">Sequence 2 observed: In Motion</text>
  <text x="120" y="525" text-anchor="end" class="time">+4163.9 ms</text>
  <line x1="140" y1="520" x2="1320" y2="520" stroke="#e6e9ec" stroke-width="1"/>
  <circle cx="350" cy="520" r="7" fill="#665191"/>
  <rect x="364" y="504" width="250" height="32" rx="6" fill="#ffffff" stroke="#665191"/>
  <text x="375" y="525" class="event">Sequence 3 completion stimulus issued (0.0)</text>
  <text x="120" y="575" text-anchor="end" class="time">+4206.7 ms</text>
  <line x1="140" y1="570" x2="1320" y2="570" stroke="#e6e9ec" stroke-width="1"/>
  <circle cx="660" cy="570" r="7" fill="#215a75"/>
  <rect x="674" y="554" width="250" height="32" rx="6" fill="#ffffff" stroke="#215a75"/>
  <text x="685" y="575" class="event">Sequence 3 callback: status=5, code=0</text>
  <text x="120" y="625" text-anchor="end" class="time">+6288.1 ms</text>
  <line x1="140" y1="620" x2="1320" y2="620" stroke="#e6e9ec" stroke-width="1"/>
  <circle cx="1240" cy="620" r="7" fill="#9a3f32"/>
  <rect x="976" y="604" width="250" height="32" rx="6" fill="#ffffff" stroke="#9a3f32"/>
  <text x="987" y="625" class="event">Completed interval absent after 2,000 ms</text>
  <rect x="930" y="700" width="430" height="36" rx="7" fill="#9a3f32" opacity="0.12"/>
  <text x="1145" y="723" text-anchor="middle" class="outcome" fill="#8a3328">VALID / FAIL · BLE boundary</text>
  <text x="40" y="723" class="note">Route-specific postconditions confirm acceptance after the pre-invocation marker; the disconnection remains part of the observed outcome.</text>
</svg>
